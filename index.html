<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Decision Hub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f4f6f9; min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 16px 60px; color: #1a1e2e;
}
.container { width: 100%; max-width: 700px; }

/* HOME */
.home-header { margin-bottom: 28px; }
.home-tag {
  display: inline-block; background: #e8edff; color: #3d52d5;
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 12px;
}
.home-header h1 { font-size: 26px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
.home-header p { font-size: 14px; color: #6b7280; line-height: 1.5; }

.scenarios-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
@media (max-width: 520px) { .scenarios-grid { grid-template-columns: 1fr; } }

.scenario-card {
  background: #fff; border-radius: 14px; padding: 20px;
  border: 1.5px solid #e5e7eb; cursor: pointer;
  transition: all .18s ease; text-align: left;
  display: flex; flex-direction: column; gap: 8px;
}
.scenario-card:hover { border-color: var(--c); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
.scenario-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; background: var(--bg);
}
.scenario-card h3 { font-size: 14px; font-weight: 700; color: #1a1e2e; }
.scenario-card p { font-size: 12.5px; color: #6b7280; line-height: 1.4; }
.scenario-arrow { font-size: 12px; color: var(--c); font-weight: 600; margin-top: auto; }

.custom-box {
  background: #fff; border-radius: 14px; padding: 24px;
  border: 1.5px solid #e5e7eb; margin-bottom: 0;
}
.custom-box label { font-size: 14px; font-weight: 700; display: block; margin-bottom: 6px; }
.custom-box p { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
.custom-textarea {
  width: 100%; min-height: 80px; padding: 12px 14px;
  border: 1.5px solid #e5e7eb; border-radius: 10px;
  font-size: 14px; font-family: inherit; resize: vertical;
  outline: none; transition: border-color .15s; color: #1a1e2e;
}
.custom-textarea:focus { border-color: #4f63d2; }
.custom-textarea::placeholder { color: #9ca3af; }
.custom-btn {
  margin-top: 12px; padding: 10px 22px; border-radius: 9px;
  border: none; background: linear-gradient(135deg, #4f63d2, #7c3aed);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity .15s;
}
.custom-btn:hover { opacity: .88; }

/* MATCH SUGGESTIONS */
.match-suggestion {
  background: #fff; border-radius: 14px; padding: 22px;
  border: 1.5px solid #e5e7eb; animation: fadeSlide .3s ease;
}
.match-suggestion h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.match-suggestion p { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
.match-cards { display: flex; flex-direction: column; gap: 10px; }
.match-card {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border: 1.5px solid #e5e7eb; border-radius: 10px; cursor: pointer;
  transition: all .15s; background: #fff;
}
.match-card:hover { border-color: #4f63d2; background: #f5f7ff; }
.match-card-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.match-card-text strong { display: block; font-size: 14px; font-weight: 600; color: #1a1e2e; }
.match-card-text span { font-size: 12.5px; color: #6b7280; }
.match-none-btn {
  margin-top: 10px; padding: 10px 18px; border-radius: 9px;
  border: 1.5px solid #e5e7eb; background: #fff; color: #374151;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.match-none-btn:hover { border-color: #9ca3af; }

/* PROGRESS */
.progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.progress-bar-bg { flex: 1; height: 5px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #4f63d2, #7c3aed);
  border-radius: 99px; transition: width .4s ease;
}
.progress-label { font-size: 12px; color: #9ca3af; white-space: nowrap; font-weight: 500; }

/* TREE NAV */
.tree-nav {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px;
}
.nav-home-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: 8px; border: 1.5px solid #e5e7eb;
  background: #fff; color: #6b7280; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.nav-home-btn:hover { border-color: #9ca3af; color: #374151; }
.nav-scenario-chip {
  font-size: 12px; background: var(--bg, #e8edff); color: var(--c, #3d52d5);
  padding: 5px 11px; border-radius: 6px; font-weight: 600;
}

/* CARD */
.card {
  background: #fff; border-radius: 16px; padding: 32px;
  box-shadow: 0 2px 16px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  animation: fadeSlide .3s ease;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.step-number { font-size: 11px; font-weight: 700; color: #9ca3af; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.question { font-size: 19px; font-weight: 700; color: #1a1e2e; line-height: 1.4; margin-bottom: 8px; }
.question-sub { font-size: 13px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option-btn {
  display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
  border: 1.5px solid #e5e7eb; border-radius: 12px; background: #fff;
  cursor: pointer; text-align: left; transition: all .15s ease; width: 100%;
}
.option-btn:hover { border-color: #4f63d2; background: #f5f7ff; transform: translateX(2px); }
.option-icon {
  width: 36px; height: 36px; border-radius: 8px; background: #f3f4f6;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; margin-top: 1px;
}
.option-text strong { display: block; font-size: 14px; font-weight: 600; color: #1a1e2e; margin-bottom: 2px; }
.option-text span { font-size: 12.5px; color: #6b7280; line-height: 1.4; }

.back-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px;
  border-radius: 8px; border: 1.5px solid #e5e7eb; background: #fff;
  color: #6b7280; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.back-btn:hover { border-color: #9ca3af; color: #374151; }

.breadcrumb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #f3f4f6; }
.breadcrumb-chip {
  font-size: 11px; background: #f3f4f6; color: #6b7280; padding: 3px 8px;
  border-radius: 4px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* RECOMMENDATION */
.rec-card {
  background: #fff; border-radius: 16px; padding: 32px;
  box-shadow: 0 2px 16px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  animation: fadeSlide .3s ease;
}
.rec-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 5px 12px; border-radius: 6px; margin-bottom: 18px;
}
.rec-badge.urgent   { background: #fef2f2; color: #dc2626; }
.rec-badge.moderate { background: #fefce8; color: #b45309; }
.rec-badge.gentle   { background: #f0fdf4; color: #15803d; }
.rec-title { font-size: 22px; font-weight: 800; color: #1a1e2e; line-height: 1.3; margin-bottom: 10px; }
.rec-summary { font-size: 14px; color: #4b5563; line-height: 1.6; margin-bottom: 24px; }
.steps-label { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #9ca3af; margin-bottom: 12px; }
.steps-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.step-item { display: flex; gap: 12px; align-items: flex-start; }
.step-num {
  width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.step-text { font-size: 14px; color: #374151; line-height: 1.55; }
.step-text strong { color: #1a1e2e; }
.watch-box { background: #fafafa; border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; margin-bottom: 24px; }
.watch-box-label { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #9ca3af; margin-bottom: 8px; }
.watch-list { display: flex; flex-direction: column; gap: 6px; }
.watch-item { font-size: 13px; color: #4b5563; display: flex; gap: 8px; }
.watch-item::before { content: "→"; color: #9ca3af; flex-shrink: 0; }
.rec-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.restart-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
  border-radius: 9px; border: none; background: linear-gradient(135deg, #4f63d2, #7c3aed);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.restart-btn:hover { opacity: .88; }
.home-btn-rec {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
  border-radius: 9px; border: 1.5px solid #e5e7eb; background: #fff;
  color: #374151; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.home-btn-rec:hover { border-color: #9ca3af; }
.print-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
  border-radius: 9px; border: 1.5px solid #e5e7eb; background: #fff;
  color: #374151; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s;
}
.print-btn:hover { border-color: #9ca3af; }
.path-summary { margin-top: 24px; padding-top: 20px; border-top: 1px solid #f3f4f6; }
.path-summary-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #9ca3af; margin-bottom: 10px; }
.path-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.path-chip { font-size: 12px; background: #f3f4f6; color: #6b7280; padding: 4px 10px; border-radius: 5px; }
@media print {
  body { background: white; padding: 0; }
  .back-btn, .restart-btn, .home-btn-rec, .print-btn, .nav-home-btn { display: none; }
  .card, .rec-card { box-shadow: none; border: 1px solid #e5e7eb; }
}
.practice-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 10px 20px;
  border-radius: 9px; border: none; background: linear-gradient(135deg, #0f766e, #0284c7);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.practice-btn:hover { opacity: .88; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
}
.modal-box {
  background: #fff; border-radius: 16px; padding: 32px; max-width: 460px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal-box h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #1a1e2e; }
.modal-box p { font-size: 13px; color: #6b7280; line-height: 1.55; margin-bottom: 16px; }
.modal-box a { color: #0284c7; }
.api-input {
  width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 9px;
  font-size: 13px; font-family: monospace; outline: none; margin-bottom: 6px; color: #1a1e2e;
}
.api-input:focus { border-color: #0284c7; }
.api-note { font-size: 12px; color: #9ca3af; margin-bottom: 18px; display: block; }
.modal-start-btn {
  width: 100%; padding: 12px; border-radius: 9px; border: none;
  background: linear-gradient(135deg, #0f766e, #0284c7);
  color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.modal-start-btn:hover { opacity: .88; }
.modal-cancel { display: block; text-align: center; margin-top: 12px; font-size: 13px; color: #9ca3af; cursor: pointer; }
.modal-cancel:hover { color: #374151; }
.practice-screen {
  background: #0f172a; border-radius: 16px; overflow: hidden;
  min-height: 520px; display: flex; flex-direction: column; animation: fadeSlide .3s ease;
}
.practice-header {
  padding: 16px 20px; border-bottom: 1px solid #1e293b;
  display: flex; align-items: center; justify-content: space-between;
}
.practice-tag {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: #0f766e22; color: #34d399; padding: 3px 8px; border-radius: 4px; margin-right: 10px;
}
.practice-title { font-size: 14px; font-weight: 700; color: #f1f5f9; }
.end-btn {
  font-size: 12px; font-weight: 600; color: #94a3b8; background: #1e293b;
  border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; transition: all .15s;
}
.end-btn:hover { color: #f1f5f9; background: #334155; }
.character-bar {
  padding: 14px 20px; background: #1e293b;
  display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f172a;
}
.char-avatar {
  width: 42px; height: 42px; border-radius: 50%; background: #0f172a;
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.char-name { font-size: 14px; font-weight: 700; color: #f1f5f9; }
.char-role { font-size: 12px; color: #64748b; }
.char-status {
  margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
}
.char-status.thinking { background: #fef3c720; color: #fbbf24; }
.char-status.speaking { background: #0f766e20; color: #34d399; }
.char-status.listening { background: #3b82f620; color: #60a5fa; }
.char-status.idle { background: #1e293b; color: #475569; }
.chat-area {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 14px; min-height: 280px;
}
.bubble-wrap { display: flex; flex-direction: column; gap: 3px; }
.bubble-wrap.manager { align-items: flex-end; }
.bubble-wrap.character { align-items: flex-start; }
.bubble-label { font-size: 11px; color: #475569; font-weight: 500; padding: 0 4px; }
.bubble {
  max-width: 80%; padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.5;
}
.bubble.manager { background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
.bubble.character { background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
.bubble.system { background: transparent; color: #475569; font-style: italic; font-size: 13px; text-align: center; max-width: 100%; }
.typing-indicator { display: flex; gap: 4px; padding: 11px 15px; background: #1e293b; border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content; }
.typing-dot { width: 7px; height: 7px; border-radius: 50%; background: #475569; animation: typingBounce 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
.mic-area {
  padding: 20px; border-top: 1px solid #1e293b;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.mic-btn {
  width: 68px; height: 68px; border-radius: 50%; border: none; background: #1e293b;
  cursor: pointer; font-size: 28px; display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.mic-btn:hover { background: #334155; transform: scale(1.05); }
.mic-btn.active { background: #dc2626; box-shadow: 0 0 0 8px #dc262625; animation: micPulse 1.5s infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 8px #dc262625} 50%{box-shadow:0 0 0 16px #dc262610} }
.mic-btn.disabled { opacity: .4; cursor: not-allowed; }
.mic-label { font-size: 12px; color: #64748b; font-weight: 500; }
.transcript-preview { font-size: 13px; color: #94a3b8; font-style: italic; text-align: center; min-height: 18px; max-width: 400px; }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>
<script>
// ─── SCENARIO METADATA ────────────────────────────────────────────────────────
const scenarioMeta = {
  disengaged: { icon:"😶", label:"Team member is disengaged",    desc:"Someone has checked out mentally or emotionally.", color:"#6366f1", bg:"#eef0fe" },
  growth:     { icon:"🚀", label:"High performer needs growth",  desc:"Your best person is outgrowing their role.", color:"#059669", bg:"#ecfdf5" },
  conflict:   { icon:"⚡", label:"Conflict between teammates",   desc:"Two people on your team are clashing.", color:"#d97706", bg:"#fffbeb" },
  flight:     { icon:"✈️", label:"Losing a star employee",       desc:"Someone great may be thinking of leaving.", color:"#dc2626", bg:"#fef2f2" },
  morale:     { icon:"📉", label:"Team morale is low",           desc:"The team is demoralized after a setback.", color:"#7c3aed", bg:"#f5f3ff" },
  newhire:    { icon:"🌱", label:"New hire struggling to ramp",  desc:"Your new person isn't gaining traction as expected.", color:"#0284c7", bg:"#e0f2fe" },
  feedback:   { icon:"💬", label:"Giving difficult feedback",    desc:"A hard conversation you're not sure how to have.", color:"#be185d", bg:"#fce7f3" },
  passedover: { icon:"🏅", label:"Passed over for promotion",   desc:"Someone didn't get the role and needs support.", color:"#9333ea", bg:"#f3e8ff" },
  blindspot:  { icon:"🔍", label:"Performance gap they don't see", desc:"They think they're doing fine — but they're not.", color:"#0f766e", bg:"#ccfbf1" },
  change:     { icon:"🧭", label:"Managing through major change", desc:"Helping a team adapt to a shift in direction or structure.", color:"#c2410c", bg:"#ffedd5" },
  capacity:   { icon:"🔋", label:"Team is overwhelmed",          desc:"Too much work, not enough capacity to sustain it.", color:"#b45309", bg:"#fef3c7" },
};

// ─── KEYWORD MAP ─────────────────────────────────────────────────────────────
const keywordMap = {
  disengaged: ['disengaged','disengagement','checked out','withdrawn','unmotivated','not engaged','quiet','low energy','distant','not showing up','zoned out','not present','stopped caring','lost interest','coasting','phoning it in'],
  growth:     ['high performer','growth','promotion','outgrowing','ready for more','top talent','star','next level','bored','wants more','advance','advancement','career path','too easy','exceeds','underchallenged','high potential','talented'],
  conflict:   ['conflict','clashing','clash','tension','fight','fighting','argument','arguing','disagree','disagreement','not getting along','friction','hostile','feud','drama','against each other','butting heads'],
  flight:     ['leaving','resign','resignation','quit','quitting','flight risk','notice','turnover','job offer','job hunting','looking elsewhere','might leave','thinking of leaving','considering leaving','job search','offer','recruited','poached'],
  morale:     ['morale','demoralized','low energy','setback','failure','layoffs','laid off','team spirit','dispirited','burned out','exhausted','defeated','struggling','after the layoff','failed','missed goal','downsizing','restructure','team suffering'],
  newhire:    ['new hire','onboarding','ramping','ramp up','not ramping','new employee','just started','recently joined','first few months','not hitting milestones','slow start','behind','onboard','orientation','struggling to ramp','new person'],
  feedback:   ['difficult feedback','hard feedback','feedback','defensive','not receiving feedback','pushback','keeps repeating','same mistake','critical feedback','negative feedback','constructive','hard conversation','not changing','resistant','won\'t change','afraid to give feedback'],
  passedover: ['passed over','promotion denied','didn\'t get promoted','not promoted','promotion rejection','someone else got promoted','promotion decision','promotion disappointment','not selected','missed promotion','bypass promotion'],
  blindspot:  ['underperformer','underperforming','performance gap','doesn\'t know','thinks they\'re doing great','blind spot','overestimates','poor self-awareness','not meeting expectations','below expectations','unaware','doesn\'t realize','overconfident','performance issue'],
  change:     ['major change','change management','transition','restructure','new strategy','pivot','transformation','reorganization','reorg','new direction','change initiative','shifting priorities','strategy change','culture change','adapting to change','managing change'],
  capacity:   ['too much work','overwhelmed','capacity','overloaded','too many projects','stretched thin','can\'t keep up','bandwidth','workload','under-resourced','not enough people','deadline pressure','unsustainable','overburdened','capacity crisis','too many priorities','burnout team'],
};

function matchScenario(text) {
  const lower = text.toLowerCase();
  const scores = {};
  for (const [key, words] of Object.entries(keywordMap)) {
    scores[key] = words.filter(w => lower.includes(w)).length;
  }
  const best = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  if (best[0][1] === 0) return [];
  return best.filter(([,s]) => s > 0 && s >= best[0][1] * 0.5).map(([k]) => k);
}

// ─── TREES ───────────────────────────────────────────────────────────────────
const trees = {

// ══════════════════════════════════════════════════════════════════════════════
// TREE 1: DISENGAGED
// ══════════════════════════════════════════════════════════════════════════════
disengaged: {
  q1: {
    type:"question", step:"Step 1 of up to 6",
    question:"How long has this person seemed disengaged?",
    sub:"Think about when you first noticed the shift — even subtle cues like shorter replies or less energy in meetings count.",
    options:[

  // RECOMMENDATIONS - DISENGAGED
  r_burnout: {
    type:"recommendation", urgency:"moderate", title:"Burnout Intervention",
    summary:"Your team member's disengagement is most likely a self-protective response to unsustainable demands. The brain under chronic stress pulls back to preserve energy. The goal is to remove load, then repair trust.",
    steps:[
      {text:"<strong>Name it without judgment.</strong> Open with curiosity: \"I've noticed you seem stretched thin — I want to understand what's really going on, not just the surface.\""},
      {text:"<strong>Audit the actual workload together.</strong> Walk through their commitments. Managers often underestimate invisible work — meetings, context-switching, administrative load."},
      {text:"<strong>Remove or defer at least one thing.</strong> Even one item off the plate signals you're serious. Ask: \"What would be most helpful to take off your plate right now?\""},
      {text:"<strong>Set a recovery check-in cadence.</strong> Agree on weekly check-ins over the next month focused specifically on how they're feeling, not just deliverables."}
    ],
    watchFor:["Signs of exhaustion beyond work — difficulty concentrating, withdrawal from social interaction","Resentment if workload isn't visibly reduced — words without action make things worse","High performers hide burnout the longest and decompensate fastest"]
  },
  r_understimulated: {
    type:"recommendation", urgency:"gentle", title:"Role Enrichment Conversation",
    summary:"Under-challenged employees often disengage quietly — and are frequently your highest-potential people. The fix isn't necessarily a promotion; it's meaningful stretch.",
    steps:[
      {text:"<strong>Acknowledge the gap directly.</strong> \"I think you may be running below your capacity — I want to understand what would genuinely challenge you.\""},
      {text:"<strong>Ask what lights them up.</strong> What type of work gives them energy? Use this to identify stretch opportunities within or adjacent to the role."},
      {text:"<strong>Create a near-term stretch project.</strong> A new initiative, cross-functional role, mentoring a junior colleague, or owning a process improvement."},
      {text:"<strong>Be honest about the ceiling.</strong> If advancement isn't available soon, say so. Offering false hope breeds resentment."}
    ],
    watchFor:["Don't add work without removing something — enrichment isn't just more load","Beware of 'busy work' as a substitute for real challenge — they'll see through it","If they're already job-hunting, enrichment may be too little too late"]
  },
  r_peer_loss: {
    type:"recommendation", urgency:"gentle", title:"Peer Connection & Grief Support",
    summary:"Losing a close work colleague is a genuine loss. People underestimate how much a work friendship anchors belonging and motivation. This requires empathy before action.",
    steps:[
      {text:"<strong>Acknowledge the loss explicitly.</strong> Don't skip over it. Name it: \"I know [name]'s leaving has been a real loss — I imagine it's hit you particularly hard.\""},
      {text:"<strong>Give it time before problem-solving.</strong> Resist the urge to immediately fill the social void or restructure relationships. Let them grieve first."},
      {text:"<strong>Intentionally rebuild connection.</strong> Introduce opportunities to connect with other colleagues — team lunches, cross-functional projects, more frequent informal check-ins."},
      {text:"<strong>Revisit in 4–6 weeks.</strong> Grief related to work relationships often has a longer tail than expected."}
    ],
    watchFor:["Don't rush them to 'get back to normal'","Watch for signs they're also considering leaving — peer departure often triggers contagion","If the departed colleague was a key emotional support, the person may feel genuinely unsafe without them"]
  },
  r_new_structure: {
    type:"recommendation", urgency:"gentle", title:"Relationship-Building & Role Clarity",
    summary:"Structural changes break invisible contracts people rely on. The disengagement is often confusion, not resistance.",
    steps:[
      {text:"<strong>Re-establish clarity on their role.</strong> Walk through: what they own, who they work with, and what success looks like now."},
      {text:"<strong>Build trust with new relationships.</strong> Schedule informal 1:1s focused on getting to know each other, not just operational handoff."},
      {text:"<strong>Acknowledge the disruption.</strong> \"I know this transition has asked a lot of you\" goes a long way."},
      {text:"<strong>Set a 60-day check-in.</strong> Give time to adjust, then explicitly assess whether they're feeling more settled."}
    ],
    watchFor:["If they had a close relationship with a previous manager, this may feel like a loss","Ambiguity about career trajectory in a new structure can spike anxiety — address it proactively","Watch for passive disengagement vs. quiet quitting — the former is recoverable"]
  },
  r_org_uncertainty: {
    type:"recommendation", urgency:"moderate", title:"Transparency & Psychological Safety",
    summary:"When people don't know if their job or org will exist in its current form, engagement rationally drops. You can't control the macro, but you can control how much clarity and honesty you provide.",
    steps:[
      {text:"<strong>Tell them what you know — and what you don't.</strong> Vague reassurance is worse than honest uncertainty. \"I don't know the timeline yet, but here's what I can tell you...\""},
      {text:"<strong>Be specific about what's stable.</strong> Even in a chaotic environment, some things are certain. Name those anchors explicitly."},
      {text:"<strong>Increase communication frequency.</strong> During uncertain periods, absence of information gets filled with anxiety. Short, regular updates help."},
      {text:"<strong>Focus their energy on what they can control.</strong> This is psychologically protective — help them invest in work and growth that matters regardless of what happens."}
    ],
    watchFor:["If you don't have clarity, don't pretend you do — it destroys trust faster than uncertainty","People in high-uncertainty environments are often quietly job-searching","This may require a team-level conversation, not just a 1:1"]
  },
  r_checkin_first: {
    type:"recommendation", urgency:"gentle", title:"Start With a Real Check-In",
    summary:"Before diagnosing or intervening, create space for the person to tell you what's going on. Many managers skip this step — and miss the real issue entirely.",
    steps:[
      {text:"<strong>Schedule a dedicated, non-task 1:1.</strong> Frame it explicitly: \"I'd like to set aside our usual agenda and just check in on how you're really doing.\""},
      {text:"<strong>Open with observation, not accusation.</strong> \"I've noticed you've seemed a bit less like yourself lately — I might be wrong, but I wanted to ask.\""},
      {text:"<strong>Ask open questions and sit with silence.</strong> \"What's been on your mind?\" \"Is there anything about your work that isn't working for you?\" Then listen more than you talk."},
      {text:"<strong>Close with a clear next step.</strong> Whatever you learn, end with: \"Here's what I'll do...\" Don't let the conversation float."}

    watchFor:["If they say 'I'm fine' but clearly aren't, follow up in a few days rather than pushing in the same conversation","Some people need trust-building before they'll open up","Your tone matters enormously — curious and warm lands completely differently than structured HR-style inquiry"]
  },
  r_perf_coaching: {

    steps:[
      {text:"<strong>Be specific, not general.</strong> \"I've noticed the last three reports had errors that weren't typical for you\" rather than \"your work quality has been off.\""},
      {text:"<strong>Explore before explaining.</strong> Before offering your diagnosis, ask: \"What's been getting in the way?\" Their answer might change your approach."},
      {text:"<strong>Co-create a standard to work toward.</strong> What does 'back on track' look like in concrete, observable terms?"},
      {text:"<strong>Set a short follow-up loop.</strong> A 2-week check-in to assess progress. Supportive, not punitive. Document the conversation informally."}
    ],
    watchFor:["If the performance issue is tied to a personal stressor, coaching alone won't solve it","Don't wait too long to escalate if early coaching doesn't shift things","Celebrate early signs of improvement — positive reinforcement beats monitoring"]

  r_perf_direct: {
    type:"recommendation", urgency:"urgent", title:"Have a Direct Performance Conversation — Now",
    summary:"When performance is causing real team impact and you haven't named it directly, both parties are hoping the other will fix it without a hard conversation. That won't happen. The kindest thing is honesty.",
    steps:[
      {text:"<strong>Prepare with specifics.</strong> Come with concrete examples: dates, deliverables, impact. Vague feedback creates defensiveness; specific observations create accountability."},
      {text:"<strong>Name the impact clearly.</strong> \"When X happened, the effect was Y on the team / stakeholders.\" Make the consequence real without being punitive."},
      {text:"<strong>Give them a chance to respond.</strong> After naming the issue, ask: \"What's your perspective on this?\" Their response tells you a great deal."},
      {text:"<strong>Agree on clear expectations and a follow-up date.</strong> Don't leave without a shared understanding of what improvement looks like and by when."}

    watchFor:["If they become defensive, stay grounded in observation — what you saw, not what you assumed","Document this conversation: date, what was discussed, what was agreed","If things don't shift in 2–3 weeks, involve HR and consider a more formal process"]

  r_pip: {
    type:"recommendation", urgency:"urgent", title:"Structured Performance Improvement Plan",
    summary:"When direct conversations haven't produced lasting change, the relationship needs clearer structure — both to give the person a real chance and to create fair documentation if things don't improve.",
    steps:[
      {text:"<strong>Involve HR before the conversation.</strong> Understand your org's PIP process, documentation requirements, and thresholds."},
      {text:"<strong>Frame it as support, not punishment.</strong> The goal of a PIP is to give someone the best possible chance to succeed with explicit, mutual accountability."},
      {text:"<strong>Define success clearly.</strong> Specific, measurable behaviors and outcomes — not vague improvements. The employee should be able to know unambiguously whether they're meeting the bar."},
      {text:"<strong>Meet frequently during the PIP period.</strong> Weekly 1:1s with a written recap."}

    watchFor:["PIPs that aren't followed through consistently erode your credibility — commit to the process","Make sure the bar is consistent with what you'd hold others to — fairness matters legally and culturally","Watch for sudden improvement followed by relapse — real change usually looks gradual"]

  r_withdrawal_new: {

    summary:"Sudden withdrawal in a previously engaged person is often a signal that something significant has happened. Check in as a human being before assuming it's about you or the job.",
    steps:[
      {text:"<strong>Ask directly but gently.</strong> \"I've noticed you've seemed less like yourself lately — I'm not asking you to share anything you don't want to, but I wanted you to know I've noticed and I care.\""},
      {text:"<strong>Distinguish work vs. non-work stressors.</strong> If something is happening outside of work, you can offer flexibility even if you can't fix the underlying issue."},
      {text:"<strong>Refer to your EAP or wellbeing resources.</strong> Mention it as genuine support, not a dismissal."},
      {text:"<strong>Give it a few weeks before escalating to performance framing.</strong> If this is a personal stressor, it will likely resolve with time and support."}

    watchFor:["Don't pry — but do create an opening. You can't help if you don't know what's happening.","Check in informally, not just in formal 1:1s — hallway conversations matter","If withdrawal continues past 4–6 weeks, you'll need to address impact even without knowing the cause"]

  r_introvert: {
    type:"recommendation", urgency:"gentle", title:"Calibrating Expectations for Introverted Team Members",
    summary:"Sometimes what looks like disengagement is a different communication style. Make sure you're measuring engagement by the right yardstick.",

      {text:"<strong>Reexamine your definition of 'engaged.'</strong> If your benchmark is group participation and verbal enthusiasm, you may be measuring extraversion, not engagement."},
      {text:"<strong>Check actual outputs and relationships.</strong> Is the work good? Do they follow through? Do 1:1 interactions feel connected? These are better signals for introverts."},
      {text:"<strong>Create different channels for contribution.</strong> Written input before meetings, async follow-up — this unlocks introverts' best thinking."},
      {text:"<strong>Ask directly: do you feel included and valued?</strong> A direct question often bypasses style differences entirely."}

    watchFor:["Introverts can still burn out and disengage — their signals are just quieter","Be careful not to overlook a real problem by attributing it all to style","Some introverts thrive in small teams and struggle in open or noisy environments"]

      {text:"<strong>Name the dynamic without taking sides.</strong> \"I've noticed some tension between you and [colleague] — I want to understand what's happening from your perspective.\""},
      {text:"<strong>Mediate a structured conversation when both are ready.</strong> Each person speaks and is heard. Set clear behavioral expectations going forward."},
      {text:"<strong>Follow up in a few weeks.</strong> Conflict that's mediated but not truly resolved often resurfaces."}

    watchFor:["If behavior meets HR-level definitions (harassment, exclusion), involve HR immediately","Sometimes conflict reflects a systemic team issue, not just two individuals","Consider whether they can actually work together or need structural separation"]

      {text:"<strong>Decide on next steps based on what you learn.</strong> Some conflicts benefit from a mediated joint conversation; others need structural solutions first."}

  r_investigate_first: {

    watchFor:["Don't let a first account shape your conclusions before you've heard all perspectives","The person who comes to you first is rarely presenting the full picture — and rarely intends to deceive","Document what you hear and when you heard it"]

  r_direct_observation_conflict: {

      {text:"<strong>Then decide on next steps</strong> based on what you learn — mediation, behavioral expectations, or escalation."}

      {text:"<strong>Find a way to observe directly or open a conversation.</strong> Create a natural opportunity to talk with the people involved: a regular 1:1 or a casual check-in."},

    watchFor:["Don't completely dismiss the grapevine — it's often directionally right even if imprecise","If you ignore it and something serious emerges, people will wonder why you didn't act","Verify quickly — don't use 'I'm still gathering information' as a way to avoid a hard conversation"]

  r_retention_attempt: {

      {text:"<strong>Invest in knowledge transfer.</strong> Document what they know, introduce them to key stakeholders, give them space to hand things off properly."},
      {text:"<strong>Stay connected after they leave.</strong> Departed employees often become referral sources, collaborators, or even boomerang hires. The relationship doesn't end at the last day."}

  r_culture_concern: {

      {text:"<strong>Accept that they may still leave.</strong> The information they've shared is valuable even if the retention doesn't work. Take it seriously either way."}

    watchFor:["If the cultural concern is about you and you respond defensively, you'll lose them and the feedback","This conversation, done badly, can damage the relationship further — enter it with genuine openness","If multiple people have raised the same concern, this is systemic — address it regardless of whether this person stays"]

  r_personal_exit: {

      {text:"<strong>Ask if any flexibility would help.</strong> Remote work, a leave of absence, reduced hours — sometimes there's a version of staying that works. Offer it genuinely, not as a manipulation."},

      {text:"<strong>Stay connected.</strong> Personal departures often lead to returns. Someone who left for family reasons may be available again in 12–18 months."}

      {text:"<strong>Create a genuine opening without putting them on the spot.</strong> \"If there's something that's not working or something you're thinking about, I'd genuinely like to know.\""},

      {text:"<strong>Then act on what you learn.</strong> A proactive conversation only builds trust if it leads to something real."}

    steps:[

      {text:"<strong>Act proactively rather than reactively.</strong> A retention adjustment before they have an offer is more effective and less expensive than a counter-offer after."}

  // RECS - MORALE

      {text:"<strong>Create a formal moment to acknowledge it.</strong> A retrospective, a team meeting, or a dedicated debrief — with a specific agenda: what happened, what we learned, what we'll do differently."},

    steps:[
      {text:"<strong>Name the loss out loud.</strong> \"We lost people who mattered. That's real, and I don't want to pretend it isn't.\" You don't need to be dramatic — just honest."},
      {text:"<strong>Create space for people to feel what they're feeling.</strong> Some people will be sad, some angry, some relieved — don't expect uniform reactions."},

  },
  r_psychological_safety: {
    type:"recommendation", urgency:"urgent", title:"Restore Psychological Safety",
    summary:"When people are afraid for their jobs, they stop taking risks, stop being honest, and start self-protecting. This is toxic to team performance. Restoring safety is the priority.",
    steps:[
      {text:"<strong>Tell people what you know — specifically.</strong> \"Here's the information I have about our team's status and what I'm hearing from leadership.\" Vague reassurance is worse than honest uncertainty."},

      {text:"<strong>Give people control over something.</strong> Even small decisions help restore a sense of agency when the broader situation feels out of control."},
      {text:"<strong>Increase your visibility and approachability.</strong> In periods of anxiety, managers who disappear into meetings make things worse. Be physically and emotionally present."}

      {text:"<strong>Acknowledge the loss without undermining the new direction.</strong> \"I know many of you valued [previous approach/leader], and this change is real. I want to make space for that before we talk about what's next.\""},
      {text:"<strong>Find the continuity.</strong> What from the previous direction is still valued and present? What values or ways of working persist? Connect old and new."},
      {text:"<strong>Involve the team in shaping what comes next.</strong> The more agency they have in the new direction, the more ownership they'll feel over it."},
      {text:"<strong>Give it time.</strong> People don't re-invest overnight. Be patient while also being clear that forward movement is required."}

      {text:"<strong>Then reconnect to the work's real impact.</strong> Find specific, recent examples of the team's work making a difference. Tell the story."},
      {text:"<strong>Create rituals that celebrate progress, not just outcomes.</strong> In hard times, celebrating the effort — not just the result — sustains motivation."},

  // RECS - NEW HIRE
  r_very_early: {
    type:"recommendation", urgency:"gentle", title:"Normalize and Simplify the First 30 Days",
    summary:"Almost everyone struggles in their first month. The risk here is that normal early confusion is misread as a permanent problem — or that the new hire misreads your concern as disappointment. Calibrate before intervening.",
    steps:[
      {text:"<strong>Name the difficulty explicitly and normalize it.</strong> 'The first few weeks here have a steep learning curve — that's normal and expected. I'm not worried, and I don't want you to be either.'"},
      {text:"<strong>Simplify their focus.</strong> If they're juggling too much, help them identify the 1–2 things that matter most right now. Cognitive overload is the #1 cause of early-stage confusion."},
      {text:"<strong>Increase check-in frequency.</strong> Daily or every-other-day brief check-ins (15 min) in the first month are far more effective than weekly 1:1s. You catch problems fast and they feel supported."},
      {text:"<strong>Ask what would help — and listen.</strong> 'What would make this week easier for you?' They often know exactly what's missing."}
    ],
    watchFor:["If they're still overwhelmed at 6 weeks, something more structural may be going on","Some new hires mask confusion to avoid looking incompetent — create explicit safety to ask 'dumb' questions","First impressions cut both ways: they're also evaluating you and the team right now"]
  },
  r_relationship_ramp: {
    type:"recommendation", urgency:"gentle", title:"Deliberately Build Connection and Belonging",
    summary:"Social isolation in a new role is one of the most common and underdiagnosed causes of early failure. People who feel like outsiders don't take risks, don't ask for help, and eventually disengage or leave.",
    steps:[
      {text:"<strong>Assign a peer buddy — not just a formal onboarding contact.</strong> Someone who will include them informally: lunch invites, Slack introductions, 'here's how things actually work around here.'"},
      {text:"<strong>Make introductions deliberately and with context.</strong> Don't just say 'meet [name].' Say: 'This is [name] — they're the best person to talk to about X. Make sure you get time with them.'"},
      {text:"<strong>Create low-stakes group moments.</strong> Team lunch, a project kick-off they're part of, a casual team ritual. Belonging builds through small repeated moments, not big events."},
      {text:"<strong>Check in specifically on belonging.</strong> 'Do you feel like you're starting to find your footing with the team?' This makes the topic safe to discuss."}
    ],
    watchFor:["Remote or hybrid new hires are especially at risk — invest more deliberately in their connection","Some people need more time to warm up; don't mistake introversion for disconnection","If the team culture is cliquey or unwelcoming, this is your problem to fix, not theirs"]
  },
  r_judgment_ramp: {
    type:"recommendation", urgency:"moderate", title:"Build Context and Decision-Making Confidence",
    summary:"Poor judgment early in a role is almost always a context problem, not a capability problem. New hires make decisions with incomplete maps — your job is to fill in the map, not just evaluate the decisions.",
    steps:[
      {text:"<strong>Share the 'why' behind decisions, not just the 'what.'</strong> When you make a call, narrate your reasoning. 'I'm doing X because Y — does that make sense given what you've seen so far?'"},
      {text:"<strong>Debrief decisions immediately and specifically.</strong> When they make a poor call, don't just correct it — walk through the reasoning together. 'What information did you have when you made this call? What context was missing?'"},
      {text:"<strong>Create low-stakes decision practice.</strong> Give them small, recoverable decisions to own entirely. Judgment develops through making and reflecting on decisions, not watching you make them."},
      {text:"<strong>Give them explicit 'rules of thumb' for your team or org.</strong> Every organization has implicit norms that experienced people know and new people don't. Make those explicit."}
    ],
    watchFor:["If poor judgment persists past 3 months with good context, this may be a capability concern","Be careful not to over-correct — removing all decision-making kills development","The speed of your feedback matters: a debrief an hour later is dramatically more effective than a week later"]
  },
  r_fix_onboarding: {
    type:"recommendation", urgency:"moderate", title:"Fix the Onboarding Before Blaming the Person",
    summary:"Inadequate onboarding is one of the most common causes of new hire struggles — and one of the most fixable. Before concluding it's a performance problem, make sure the environment set them up to succeed.",
    steps:[
      {text:"<strong>Audit what's missing.</strong> What training, context, relationships, or tools haven't they had adequate access to? Make a list and prioritize."},
      {text:"<strong>Build a targeted catch-up plan.</strong> This week: fill in the most critical gaps. Map out a clear learning path for the next 4 weeks."},
      {text:"<strong>Have an honest conversation with them about the gaps.</strong> 'I realize we haven't set you up well in a few areas — that's on us, not you. Here's what we're going to do differently.'"},
      {text:"<strong>Set a revised success timeline.</strong> If they lost 4 weeks to poor onboarding, give them 4 weeks of grace on ramp expectations. Document this."}
    ],
    watchFor:["If onboarding gaps have been significant, the new hire may have formed incorrect mental models that are hard to undo","Acknowledge the gap to them clearly — new hires who feel set up to fail often leave before the fix lands","Use this as a trigger to systematize onboarding so the next hire doesn't have the same experience"]
  },
  r_ability_check: {
    type:"recommendation", urgency:"moderate", title:"Conduct an Honest Capability Assessment",
    summary:"When resources were adequate and the person still isn't absorbing the work, it's time to assess whether there's a capability gap. This is a sensitive conversation — but an early honest one is far kinder than a late one.",
    steps:[
      {text:"<strong>Have a direct, compassionate check-in conversation.</strong> 'I want to share some observations and also hear how you're feeling. I've noticed [specific things]. What's your own read on how things are going?'"},
      {text:"<strong>Separate what's coachable from what isn't.</strong> Skills and knowledge gaps can often be closed. Fundamental aptitude mismatches — the role requires a type of thinking they genuinely don't have — usually can't."},
      {text:"<strong>Create a short structured support plan.</strong> 2–4 weeks, with specific goals and daily or weekly check-ins. This tests whether intensive support shifts the trajectory."},
      {text:"<strong>Be prepared for the conversation about fit.</strong> If support doesn't shift things in 4–6 weeks, the kindest thing for both parties is an honest conversation about whether this is the right role."}
    ],
    watchFor:["Early exits — when mutually agreed and handled well — are better for both parties than prolonged mismatch","Don't let empathy for the person prevent you from acting on what the data is telling you","Document your observations and the support provided — this protects both parties if you reach a formal decision point"]
  },
  r_perf_convo_new: {
    type:"recommendation", urgency:"urgent", title:"Have a Direct Performance Conversation — With a Clear Timeline",
    summary:"At 3–6 months, below-expectations performance needs to be named explicitly. This is the window to turn things around — but only if you're honest about the gap and clear about what success looks like.",
    steps:[
      {text:"<strong>Name the gap specifically and kindly.</strong> 'I want to be honest with you — where you are right now is below where we need you to be at this stage. I want to share specifically what I'm seeing.'"},
      {text:"<strong>Set concrete expectations for the next 30–60 days.</strong> Not 'do better' — but specific, observable, measurable outcomes. What does 'on track' look like?"},
      {text:"<strong>Identify together what's getting in the way.</strong> Is it still a context issue? A skill gap? Something personal? Their answer shapes your support."},
      {text:"<strong>Make clear what's at stake — without being punitive.</strong> 'If we're not seeing [X] by [date], we'll need to have a harder conversation about fit. I want to help you get there.'"}
    ],
    watchFor:["Don't soften this so much that the message doesn't land — they need to understand the urgency","The 30–60 day window is real: acting now gives them a chance; waiting until month 9 doesn't","If they're surprised by this conversation, your earlier feedback was too soft — recalibrate going forward"]
  },
  r_repeat_mistakes: {
    type:"recommendation", urgency:"moderate", title:"Address the Pattern of Repeating Mistakes",
    summary:"When the same errors reappear after feedback, the feedback itself usually isn't landing. The solution is to change how the feedback is given and how accountability is built in — not just to repeat it louder.",
    steps:[
      {text:"<strong>Name the pattern explicitly.</strong> 'I want to share something I've noticed — this is the third time we've seen [X]. I'm not saying this to be critical; I want to understand what's happening.'"},
      {text:"<strong>Diagnose the root cause together.</strong> Are they forgetting? Not understanding the standard? Moving too fast? Lacking confidence? The fix depends on the cause."},
      {text:"<strong>Change the feedback medium.</strong> If verbal feedback isn't sticking, try written. If in-the-moment, try a debrief the next day. Different formats reach different people."},
      {text:"<strong>Build in a check before the mistake happens.</strong> For recurring patterns, create a 'checkpoint' — a moment before the work is finalized where the specific risk is reviewed."}
    ],
    watchFor:["Repeating mistakes after explicit feedback, with awareness of the standard, can indicate an aptitude issue — assess carefully","Some patterns are environmental (rushing, unclear process) not personal — look at the system as well as the person","If the pattern persists beyond another 4–6 weeks of specific intervention, escalate the conversation"]
  },
  r_culture_fit_new: {
    type:"recommendation", urgency:"moderate", title:"Address Cultural Integration Directly",
    summary:"Cultural disconnection at 3–6 months is concerning because it's past the adjustment period. This needs a direct conversation — not to blame, but to name and solve.",
    steps:[
      {text:"<strong>Have an explicit conversation about culture fit — not as a threat, as a problem to solve.</strong> 'I've noticed you still seem a bit on the outside of the team. I want to understand what would help.'"},
      {text:"<strong>Name the specific norms they may be missing.</strong> Every team has unwritten rules. Make them written: how we communicate, how we give feedback, how we make decisions together."},
      {text:"<strong>Assess whether the problem is them or the team.</strong> Is the culture genuinely unwelcoming? Are there cliques or in-group dynamics excluding them? That's your job to fix, not theirs."},
      {text:"<strong>Set a 30-day milestone.</strong> What does 'more integrated' look like concretely? More participation in team conversations? A collaborative project with a specific colleague?"}
    ],
    watchFor:["Some people take longer to warm up — distinguish genuine disconnection from natural introversion","If multiple new hires have had the same experience, the culture itself needs work","Cultural fit conversations can slide into bias — focus on specific observable behaviors, not vague 'fit' language"]
  },
},

  // RECS - FEEDBACK
  r_evidence_fb: {
    type:"recommendation", urgency:"moderate", title:"Lead With Specific Evidence, Not Interpretation",
    summary:"Dismissive responses often happen because feedback feels like an opinion. The antidote is to anchor everything in specific, observable facts — then let the person engage with the evidence rather than the judgment.",
    steps:[
      {text:"<strong>Separate facts from interpretation.</strong> Instead of 'you seem disengaged in meetings,' say 'In the last three team meetings, you didn't speak and your camera was off the whole time. Help me understand what's happening.'"},
      {text:"<strong>Bring the specific examples into the room.</strong> If possible, reference dates, emails, deliverables — things they can't credibly deny because they're verifiable."},
      {text:"<strong>Ask questions rather than making statements.</strong> 'What was going through your mind when [X happened]?' Curiosity disarms defensiveness better than certainty."},
      {text:"<strong>Hold the observation even if they push back.</strong> 'I hear that you see it differently. I'm sharing what I observed, and I'd like us to figure out together what's going on.'"}
    ],
    watchFor:["If they consistently dismiss all evidence, this may be a deeper self-awareness issue — consider involving HR","Don't soften the evidence to the point where the message disappears","After the conversation, follow up in writing so there's a shared record of what was discussed"]
  },
  r_safe_fb: {
    type:"recommendation", urgency:"gentle", title:"Create Emotional Safety Before Giving the Feedback",
    summary:"When someone becomes emotionally overwhelmed by feedback, the message stops landing. Your job is to create the conditions where they can hear it — and that starts before you say the first word.",
    steps:[
      {text:"<strong>Choose the setting deliberately.</strong> Private, unrushed, not right before a big meeting or at the end of a stressful day. The environment shapes the reception."},
      {text:"<strong>Open with genuine care.</strong> 'I'm sharing this because I think highly of you and I want you to be successful here.' This isn't softening — it's establishing the intent."},
      {text:"<strong>If they become emotional, pause.</strong> Don't push through. 'I can see this is hitting hard. Let's take a few minutes.' Continuing when someone is flooded makes it worse, not better."},
      {text:"<strong>Separate the feedback session from the resolution session.</strong> Sometimes the right approach is to give the feedback, let it land, and schedule a follow-up to discuss next steps once they've had time to process."}
    ],
    watchFor:["Emotional responses aren't always bad — sometimes they mean the feedback landed. The problem is if they can't recover enough to engage.","If they become emotional every time, this pattern itself may be worth addressing","Don't interpret tears as disagreement — sometimes people cry when they know you're right"]
  },
  r_structured_fb: {
    type:"recommendation", urgency:"moderate", title:"Use Structure to Contain Pushback",
    summary:"An argumentative response to feedback often means the person doesn't feel heard — or has a genuine factual disagreement. Structure the conversation so there's a clear moment for their voice before you respond.",
    steps:[
      {text:"<strong>Explicitly invite their perspective before defending your own.</strong> 'I'd like to share what I've observed — and then I genuinely want to hear how you see it. I'm not here to win an argument.'"},
      {text:"<strong>Don't get pulled into debating the facts.</strong> If they challenge a specific observation, acknowledge it without caving: 'You may be right about that specific instance. My overall observation still stands.'"},
      {text:"<strong>Separate factual disagreements from behavioral expectations.</strong> 'We can disagree about what happened — but I want to be clear about what I need going forward, regardless.'"},
      {text:"<strong>Know when to end the conversation.</strong> If pushback escalates to hostility or the conversation becomes unproductive, it's appropriate to say 'I think we need to pick this up again when things are calmer' and exit."}
    ],
    watchFor:["Persistent argumentativeness in feedback conversations is itself a behavioral issue that may need to be named separately","If they're challenging your authority rather than the feedback, that requires a different conversation","HR presence may be warranted if the dynamic has become hostile"]
  },
  r_different_approach_fb: {
    type:"recommendation", urgency:"moderate", title:"Try a Fundamentally Different Approach",
    summary:"If the same feedback has been given once or twice without change, the issue is usually delivery, not content. The message might be right but the medium, framing, or timing isn't landing.",
    steps:[
      {text:"<strong>Change the medium.</strong> If you've given verbal feedback, try written — it forces precision and gives them something to return to. If written, try verbal — sometimes people need to feel the conversation."},
      {text:"<strong>Change the framing.</strong> Instead of 'here's what you need to do differently,' try 'here's the impact this is having and here's what success looks like' — same message, very different entry point."},
      {text:"<strong>Bring in a third perspective.</strong> If this is a recurring pattern, a 360-style observation from peers (not just you) often lands very differently: 'You're not just hearing this from me — here's how others are experiencing it.'"},
      {text:"<strong>Co-create the solution.</strong> Instead of telling them what to change, ask: 'How do you think you could approach [X] differently?' People change more readily when the solution feels like theirs."}
    ],
    watchFor:["If the behavior still doesn't change after a genuinely different approach, this moves from a feedback problem to an accountability problem","Make sure the feedback has been direct enough — sometimes the person genuinely didn't understand the severity","Document what approaches you've tried and when"]
  },
  r_pattern_accountability_fb: {
    type:"recommendation", urgency:"urgent", title:"Name the Pattern and Create Real Accountability",
    summary:"When feedback has been given clearly and repeatedly without change, you've moved beyond a coaching conversation. This now requires explicit accountability — with clear consequences for continued non-change.",
    steps:[
      {text:"<strong>Name the pattern explicitly.</strong> 'I want to be very direct: we've talked about [X] three times now. The behavior hasn't changed. That's the conversation we need to have today.'"},
      {text:"<strong>Ask directly: do they understand why this matters?</strong> Sometimes people don't have self-awareness about the impact. Sometimes they've deprioritized it because they haven't believed there are real consequences."},
      {text:"<strong>Make the consequences explicit.</strong> This doesn't have to be punitive language — but it does have to be clear: 'If this doesn't change by [date], it will affect [performance rating / your ability to stay in this role / our ability to work together effectively].'"},
      {text:"<strong>Document this conversation and involve HR.</strong> At this point you need a paper trail. Contact your HR partner before or after this conversation."}
    ],
    watchFor:["Consequences only work if they're real — don't threaten what you're not prepared to follow through on","Sometimes people change dramatically when they realize you're serious. Don't assume the outcome before having this conversation.","This conversation sometimes surfaces the underlying reason the feedback hasn't landed — a personal issue, disagreement with the standard, or skills gap. Stay open to that."]
  },
  r_personal_fb: {
    type:"recommendation", urgency:"moderate", title:"Giving Personal Feedback — With Dignity",
    summary:"Personal feedback (hygiene, physical presentation) is among the hardest to give — and the most avoided. Avoidance is not kindness. The person deserves to know.",
    steps:[
      {text:"<strong>Do it in private and keep it short.</strong> This isn't a conversation to stretch out. State it simply, matter-of-factly, and with care: 'I need to share something with you, and I want to do it respectfully.'"},
      {text:"<strong>Focus on observable impact, not the person.</strong> Not 'you smell bad' but 'I've heard from others that there's a noticeable odor — I wanted to make sure you heard this from me privately rather than from someone else, or not at all.'"},
      {text:"<strong>Don't speculate about cause — stick to the observation.</strong> Medical conditions, cultural practices, financial constraints — you don't know the reason, and you don't need to. Just describe what's happening."},
      {text:"<strong>Create space for a brief response, then end the topic.</strong> They may be embarrassed. They don't owe you an explanation. 'I just wanted you to know. I'll leave it there.'"}
    ],
    watchFor:["This conversation is rarely as bad as the anticipation — most people are grateful once the initial embarrassment passes","Don't delegate this to HR as a first step — it will feel more punitive and less human than if you say it directly","If the issue stems from a medical condition, be prepared for that possibility and respond with accommodation rather than judgment"]
  },
  r_cultural_fb: {
    type:"recommendation", urgency:"gentle", title:"Navigating Culturally Sensitive Feedback",
    summary:"When a behavior stems from cultural background or communication norms different from the team's, the feedback conversation requires extra care — and extra humility about whose norms are being centered.",
    steps:[
      {text:"<strong>Start with curiosity, not correction.</strong> 'I've noticed [behavior] and I want to understand it better before I share my own perspective. Can you help me understand where that comes from for you?'"},
      {text:"<strong>Acknowledge your own cultural lens.</strong> 'I recognize my feedback is coming from my own cultural frame — I want to share what I'm seeing while acknowledging that.' This isn't relativism; it's honesty."},
      {text:"<strong>Be clear about which norms are team-specific vs. absolute.</strong> Some things are about this team's culture (which can be adapted to). Others are about professional or legal standards (which aren't optional). Name which you're talking about."},
      {text:"<strong>Focus on the outcome, not the style.</strong> 'I need [outcome] to happen. There may be different ways to get there — I'm open to how you approach it if the result is consistent.'"}
    ],
    watchFor:["Cultural feedback conversations can veer into bias if they're really about 'fit' rather than behavior — be honest with yourself about the distinction","HR should be a resource here, not a threat — loop them in before the conversation as a thought partner","Don't lower the bar for what's required. Do lower the assumption that there's only one way to get there."]
  },
  r_interpersonal_fb: {
    type:"recommendation", urgency:"moderate", title:"Feedback About How They Affect Others",
    summary:"Interpersonal feedback — about tone, respect, inclusion — often feels the most personal and prompts the strongest defensiveness. The key is anchoring in observable behavior and described impact, not character judgments.",
    steps:[
      {text:"<strong>Describe the behavior, not the person.</strong> Not 'you're dismissive' but 'in last Tuesday's meeting, when [colleague] raised their idea, you interrupted them twice and then moved on without acknowledging the point.'"},
      {text:"<strong>Describe the impact on others, not your interpretation of intent.</strong> 'The effect was that [colleague] went quiet for the rest of the meeting. Others on the team have noticed this pattern.'"},
      {text:"<strong>Separate intent from impact explicitly.</strong> 'I'm not saying you meant to make them feel dismissed — but the impact was that they did. And impact is what we need to address.'"},
      {text:"<strong>Ask for their perspective.</strong> 'What was your experience of that interaction?' Then listen. Sometimes there's context that changes the picture. Often there isn't — but the question keeps them engaged."}
    ],
    watchFor:["If the behavior rises to harassment or a hostile work environment, this is no longer a coaching conversation — involve HR immediately","Interpersonal feedback that isn't taken seriously can drive good people off the team — treat it with urgency","Document what you observed, who was affected, and what you said — even for a coaching conversation"]
  },
  r_fb_framework: {
    type:"recommendation", urgency:"gentle", title:"A Simple Framework for Difficult Feedback",
    summary:"Not knowing how to structure feedback is the most fixable obstacle. The SBI model (Situation–Behavior–Impact) works for almost any feedback conversation and takes the guesswork out of framing.",
    steps:[
      {text:"<strong>S — Situation:</strong> Anchor it in a specific moment. 'In Thursday's client call...' or 'In the last month's performance data...' A specific context stops the conversation from becoming about general character."},
      {text:"<strong>B — Behavior:</strong> Describe exactly what happened — observable, factual, free of interpretation. 'You interrupted the client three times' not 'you were rude.'"},
      {text:"<strong>I — Impact:</strong> Describe the effect. 'The client looked uncomfortable and went quiet for the rest of the call. I'm concerned about the relationship.' Impact is what makes feedback matter."},
      {text:"<strong>Then ask, don't tell.</strong> Close with a question: 'What was your experience of that?' or 'What would you do differently?' This turns feedback into a conversation rather than a verdict."}
    ],

  }
  if (matches.length > 1) {
    const matchCards = matches.map(key => {
      const m = scenarioMeta[key];
      return `<div class="match-card" onclick="startTree('${key}')">
        <div class="match-card-icon" style="background:${m.bg}">${m.icon}</div>
        <div class="match-card-text">
          <strong>${m.label}</strong>
          <span>${m.desc}</span>
        </div>
      </div>`;
    }).join("");
    document.getElementById("app").innerHTML = `
      <div class="match-suggestion">
        <h3>Here are the closest matches to your situation</h3>
        <p>Choose the one that fits best, or go back to browse all scenarios.</p>
        <div class="match-cards">${matchCards}</div>
        <button class="match-none-btn" onclick="renderHome()">← Back to all scenarios</button>
      </div>`;
    return;
  }
  // No match — try a general prompt
  alert("We couldn't match that to a specific scenario. Try browsing the scenarios above, or rephrase your situation.");
}

// ─── START A TREE ─────────────────────────────────────────────────────────────
function startTree(key) {
  currentScenario = key;
  currentNode = null;
  history = [];
  render("q1");
}

// ─── RENDER QUESTION / REC ───────────────────────────────────────────────────
function render(nodeId) {
  currentNode = nodeId;
  const node = trees[currentScenario][nodeId];
  if (!node) return;
  const meta = scenarioMeta[currentScenario];
  const progressPct = node.type === "recommendation" ? 100 : estimateProgress(node);

  const navHtml = `
    <div class="tree-nav">
      <button class="nav-home-btn" onclick="renderHome()">← All scenarios</button>
      <div class="nav-scenario-chip" style="--bg:${meta.bg};--c:${meta.color}">${meta.icon} ${meta.label}</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>
      <div class="progress-label">${progressPct >= 100 ? "Recommendation ready" : "Working through it..."}</div>
    </div>`;

  if (node.type === "question") {
    const breadcrumbHtml = history.length > 0
      ? `<div class="breadcrumb">${history.map(h => `<span class="breadcrumb-chip">${h.label}</span>`).join("")}</div>` : "";
    const backBtn = history.length > 0
      ? `<button class="back-btn" onclick="goBack()">← Back</button>` : "";
    const opts = node.options.map((o,i) => `
      <button class="option-btn" onclick="choose('${nodeId}',${i})">
        <div class="option-icon">${o.icon}</div>
        <div class="option-text">
          <strong>${o.label}</strong>
          ${o.desc ? `<span>${o.desc}</span>` : ""}
        </div>
      </button>`).join("");

    document.getElementById("app").innerHTML = navHtml + `
      <div class="card">
        <div class="step-number">${node.step}</div>
        <div class="question">${node.question}</div>
        ${node.sub ? `<div class="question-sub">${node.sub}</div>` : ""}
        <div class="options">${opts}</div>
        ${backBtn}
        ${breadcrumbHtml}
      </div>`;
  }

  if (node.type === "recommendation") {
    const ui = urgencyInfo(node.urgency);
    const c = meta.color;
    const stepsHtml = node.steps.map((s,i) => `
      <div class="step-item">
        <div class="step-num" style="background:${c}20;color:${c}">${i+1}</div>
        <div class="step-text">${s.text}</div>
      </div>`).join("");
    const watchHtml = node.watchFor.map(w => `<div class="watch-item">${w}</div>`).join("");
    const pathChips = history.map(h => `<span class="path-chip">${h.label}</span>`).join("");

    document.getElementById("app").innerHTML = navHtml + `
      <div class="rec-card">
        <div class="rec-badge ${ui.cls}">${ui.label}</div>
        <div class="rec-title">${node.title}</div>
        <div class="rec-summary">${node.summary}</div>
        <div class="steps-label">Recommended Actions</div>
        <div class="steps-list">${stepsHtml}</div>
        <div class="watch-box">
          <div class="watch-box-label">Things to Watch For</div>
          <div class="watch-list">${watchHtml}</div>
        </div>
        <div class="rec-actions">
          <button class="practice-btn" onclick="initPractice('${currentScenario}')">🎤 Practice this conversation</button>
          <button class="restart-btn" onclick="startTree('${currentScenario}')">↺ Restart</button>
          <button class="home-btn-rec" onclick="renderHome()">← All scenarios</button>
          <button class="print-btn" onclick="window.print()">🖨 Print</button>
        </div>
        ${pathChips ? `<div class="path-summary"><div class="path-summary-label">Your path</div><div class="path-chips">${pathChips}</div></div>` : ""}
      </div>`;
  }
}

function estimateProgress(node) {
  if (!node.step) return 50;
  const m = node.step.match(/Step (\d+) of up to (\d+)/);
  if (m) return Math.round((parseInt(m[1]) / parseInt(m[2])) * 80);
  return 50;
}

function choose(fromId, idx) {
  const node = trees[currentScenario][fromId];
  const opt = node.options[idx];
  history.push({ nodeId: fromId, label: opt.label, next: opt.next });
  render(opt.next);
}

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  render(prev.nodeId);
}

          <div class="bubble-label">${char.name.split(' ')[0]}</div>
          <div class="bubble character">${script.opening}</div>
        </div>
        <div class="bubble-wrap character">
          <div class="bubble system">Type your response as the manager below. Press Enter or click Send.</div>
        </div>
      </div>
      <div class="mic-area">
        <div style="display:flex;gap:8px;width:100%;max-width:540px">
          <input id="managerInput" type="text" class="api-input" style="margin:0;flex:1;font-family:inherit"
            placeholder="Type your response as the manager…"
            onkeydown="if(event.key==='Enter')sendManagerText()" />
          <button class="practice-btn" style="white-space:nowrap;padding:10px 16px" onclick="sendManagerText()">Send →</button>
        </div>
        <div class="mic-label" style="margin-top:6px">Tip: Try checking in, asking open questions, or sharing what you've observed</div>
      </div>
    </div>`;

  setTimeout(() => document.getElementById('managerInput')?.focus(), 100);
  speakText(script.opening);
}

function endPractice() {
  window.speechSynthesis?.cancel();
  isBotSpeaking = false;
  render(currentNode);
}

function setCharStatus(state) {
  const el = document.getElementById('charStatus');
  if (!el) return;
  const labels = { thinking:'Thinking…', speaking:'Speaking…', idle:'Waiting for you…' };
  el.className = 'char-status ' + state;
  el.textContent = labels[state] || 'Waiting for you…';
}

function sendManagerText() {
  const input = document.getElementById('managerInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  handleManagerText(text);
}

function handleManagerText(text) {
  const char = currentCharacter;
  const firstName = char.name.split(' ')[0];
  const script = practiceScripts[currentScenario] || practiceScripts['disengaged'];

  addBubble('manager', 'You (Manager)', text);
  setCharStatus('thinking');
  showTypingIndicator();

  const lower = text.toLowerCase();
  let reply = null;

  // Keyword match — find first unused match
  for (const r of script.responses) {
    if (!r.used && r.keys.some(k => lower.includes(k))) {
      r.used = true;
      reply = r.text;
      break;
    }
  }

  // Fallback if no match
  if (!reply) {
    const idx = (script._fallbackIdx || 0) % script.fallback.length;
    reply = script.fallback[idx];
    script._fallbackIdx = idx + 1;
  }

  const delay = 900 + Math.random() * 700;
  setTimeout(() => {
    hideTypingIndicator();
    addBubble('character', firstName, reply);
    speakText(reply);
    setCharStatus('idle');
    const input = document.getElementById('managerInput');
    if (input) { input.disabled = false; input.focus(); }
  }, delay);
}

function addBubble(who, label, text) {
  const area = document.getElementById('chatArea');
  if (!area) return;
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap ' + who;
  wrap.innerHTML = `<div class="bubble-label">${label}</div><div class="bubble ${who}">${text}</div>`;
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function showTypingIndicator() {
  const area = document.getElementById('chatArea');
  if (!area) return;
  const ind = document.createElement('div');
  ind.id = 'typingIndicator';
  ind.className = 'bubble-wrap character';
  ind.innerHTML = `<div class="bubble-label">${currentCharacter.name.split(' ')[0]}</div>
    <div class="typing-indicator">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>`;
  area.appendChild(ind);
  area.scrollTop = area.scrollHeight;
}

function hideTypingIndicator() {
  document.getElementById('typingIndicator')?.remove();
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  isBotSpeaking = true;
  setCharStatus('speaking');
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.93;
  utterance.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang === 'en-US' && v.name.includes('Samantha'))
    || voices.find(v => v.lang === 'en-US' && !v.name.includes('Google'))
    || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utterance.voice = preferred;
  utterance.onend = () => { isBotSpeaking = false; setCharStatus('idle'); };
  window.speechSynthesis.speak(utterance);
}

// INIT
renderHome();
</script>
